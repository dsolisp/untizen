<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UnTizen — Quiet Home demo harness</title>
<!--
  Offline visual harness for the Quiet Home launcher. It loads the real assets
  from ../launcher/assets and mirrors the layout constants in launcher/src/Home.cs
  so documentation screenshots match what the TV renders.

  Open with:  chrome --allow-file-access-from-files demo/harness.html?page=home&theme=glass&focus=3
  Parameters: page=home|apps|settings   theme=original|glass|dark
              focus=<slot index>        libpage=<library page>
              recents=<comma separated actions, newest first>  live=<vconf source>

  recents/live mirror the launcher's journal and the TV's live input, so shots can
  show the hero and dock reordering exactly like Inputs.Ordered/Recents.DockActions.
-->
<style>
@font-face{font-family:"Quiet Inter";src:url("../launcher/assets/fonts/QuietInter-Medium.ttf");font-weight:500}
@font-face{font-family:"Quiet Inter";src:url("../launcher/assets/fonts/QuietInter-Semibold.ttf");font-weight:600}
@font-face{font-family:"Quiet Inter Display";src:url("../launcher/assets/fonts/QuietInter-Display.ttf")}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}
#stage img{position:absolute;display:block;pointer-events:none}
.txt{position:absolute;font-family:"Quiet Inter",sans-serif;font-weight:500;white-space:nowrap;
     display:flex;align-items:center}
.txt.display{font-family:"Quiet Inter Display","Quiet Inter",sans-serif;font-weight:600}
.txt.semibold{font-weight:600}
.txt.center{justify-content:center}
.txt.end{justify-content:flex-end}
.card{position:absolute;overflow:hidden}
.card>*{position:absolute}
.tab{border-radius:34px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const A = "../launcher/assets/";
const params = new URLSearchParams(location.search);
const page = params.get("page") || "home";
const themeName = params.get("theme") || "original";
const focus = parseInt(params.get("focus") || "0", 10);
const libpage = parseInt(params.get("libpage") || "0", 10);
const recents = (params.get("recents") || "").split(",").map(s => s.trim())
                  .filter(s => s.startsWith("app:") || s.startsWith("hdmi:"));
const live = parseInt(params.get("live") || "14", 10);

/* Mirrors launcher/src/Recents.cs: catalogue order, hero order and dock fill. */
const INPUTS = [
  {name:"PS5",  source:14, tagline:"Let's play.", desc:"Console · HDMI",
   hero:"hero-ps5.svg",  portrait:"portrait-ps5.svg", dock:"ps5"},
  {name:"Xbox", source:13, tagline:"Game on.",    desc:"Console · HDMI",
   hero:"hero-xbox.svg", portrait:"feature-xbox.svg", dock:"xbox"},
  {name:"PC",   source:16, tagline:"Back to it.", desc:"Computer · HDMI",
   hero:"hero-pc.svg",   portrait:"feature-hdmi.svg", dock:"pc"},
];
INPUTS.forEach(i => i.action = "hdmi:" + i.source);
const DEFAULT_DOCK = ["app:org.tizen.netflix-app", "app:com.samsung.tv.cobalt-yt",
                      "app:org.tizen.primevideo", "hdmi:14", "hdmi:13"];
function orderedInputs() {
  const order = [];
  const liveInput = INPUTS.find(i => i.source === live);
  if (liveInput) order.push(liveInput);
  for (const a of recents) { const i = INPUTS.find(x => x.action === a); if (i && !order.includes(i)) order.push(i); }
  for (const i of INPUTS) if (!order.includes(i)) order.push(i);
  return order;
}

const THEMES = {
  original: {bg:"free-background.svg", window:"#F5F5F7", ink:"#1D1D1F", muted:"#6E6E73",
             accent:"#3D4AB8", card:"rgba(0,0,0,0)", border:"rgba(255,255,255,0.28)",
             ring:"rgba(255,255,255,0.8)", tab:"rgba(255,255,255,0.7)"},
  glass:    {bg:"glass-background.svg", window:"#0E1116", ink:"#F5F7FA", muted:"rgba(255,255,255,0.55)",
             accent:"#4DA3FF", card:"rgba(255,255,255,0.09)", border:"rgba(255,255,255,0.18)",
             ring:"#4DA3FF", tab:"rgba(255,255,255,0.14)"},
  dark:     {bg:"dark-background.svg", window:"#000000", ink:"#F0F0F0", muted:"#8A8A8E",
             accent:"#7C5CFF", card:"#1C1C1E", border:"#2C2C2E", ring:"#7C5CFF",
             tab:"rgba(255,255,255,0.10)"}
};
const T = THEMES[themeName] || THEMES.original;
const stage = document.getElementById("stage");
stage.style.background = T.window;

function img(src, x, y, w, h, extra) {
  const el = document.createElement("img");
  el.src = A + src; el.style.left = x + "px"; el.style.top = y + "px";
  el.style.width = w + "px"; el.style.height = h + "px";
  if (extra) Object.assign(el.style, extra);
  stage.appendChild(el); return el;
}
function text(str, x, y, w, h, size, color, face, align) {
  const el = document.createElement("div");
  el.className = "txt" + (face === "Display" ? " display" : face === "Semibold" ? " semibold" : "")
               + (align ? " " + align : "");
  el.textContent = str;
  el.style.cssText += `left:${x}px;top:${y}px;width:${w}px;height:${h}px;font-size:${size}px;color:${color}`;
  stage.appendChild(el); return el;
}
function hexLuma(hex) {
  const n = parseInt(hex.replace("#", ""), 16);
  return (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
}
function card(x, y, w, h, radius, bg, focused, row) {
  const el = document.createElement("div");
  el.className = "card";
  const scale = focused ? (row === 0 ? 1.05 : row === 1 ? 1.20 : row === 2 ? 1.035 : row === 3 ? 1.055 : 1.10) : 1;
  const lift = focused && (row === 0 || row === 3) ? 5 : 0;
  el.style.left = (x + w / 2) + "px"; el.style.top = (y + h / 2 - lift) + "px";
  el.style.width = w + "px"; el.style.height = h + "px";
  el.style.borderRadius = radius + "px";
  el.style.background = bg;
  el.style.transform = `translate(-50%,-50%) scale(${scale})`;
  const bw = row === 3 ? (focused ? 4 : 1) : row === 2 ? (focused ? 3 : 1) : row === 0 ? 1 : 0;
  if (bw) { el.style.border = bw + "px solid " + (focused ? (row === 3 ? T.accent : T.ring) : T.border); }
  stage.appendChild(el); return el;
}

/* ---- chrome: background, title, tabs, clock --------------------------- */
img(T.bg, 0, 0, 1920, 1080);
text(page === "home" ? "Home" : page === "apps" ? "Your Apps" : "Quick Settings", 76, 55, 1350, 100, 76, T.ink, "Display");
const nav = [["Inputs", 54, 153], ["Apps", 221, 131], ["Settings", 366, 182]];
const active = page === "home" ? 0 : page === "apps" ? 1 : 2;
nav.forEach((t, i) => {
  const el = text(t[0], t[1], 158, t[2], 68, 30, i === active ? T.ink : T.muted, i === active ? "Semibold" : "Medium", "center");
  if (i === active) { el.style.background = T.tab; }
});
text("7:42 PM", 1540, 170, 300, 45, 24, T.muted, "Medium", "end");

/* ---- slot model, mirroring Home.cs BuildPage -------------------------- */
const slots = [];
function slot(name, row, x, y, w, h, draw) { slots.push({name, row, x, y, w, h, draw}); }

if (page === "home") {
  const order = orderedInputs();
  const xs = [80, 1160, 1520];
  order.forEach((input, i) => {
    const w = i === 0 ? 1040 : 320;
    slot(input.name, 0, xs[i], 262, w, 442, el => {
      const im = document.createElement("img");
      im.src = A + (i === 0 ? input.hero : input.portrait);
      im.style.cssText = `left:0;top:0;width:${w}px;height:442px`;
      el.appendChild(im);
      if (i === 0) {
        const l1 = document.createElement("div"); l1.className = "txt semibold";
        l1.textContent = input.name; l1.style.cssText = "left:44px;top:52px;width:460px;height:40px;font-size:24px;color:#DBE8FF";
        const l2 = document.createElement("div"); l2.className = "txt display";
        l2.textContent = input.tagline; l2.style.cssText = "left:40px;top:124px;width:470px;height:100px;font-size:72px;color:#FFFFFF";
        const l3 = document.createElement("div"); l3.className = "txt";
        l3.textContent = "Switch to HDMI"; l3.style.cssText = "left:46px;top:246px;width:430px;height:48px;font-size:30px;color:#E0EDFF";
        el.append(l1, l2, l3);
      }
    });
    text(input.name, xs[i], 716, w, 45, 31, T.ink, "Semibold");
    text(input.desc, xs[i], 760, w, 36, 24, T.muted);
  });
}

if (page === "home") img("glass-shelf.svg", 0, 784, 1920, 280);

/* ---- library + dock need the catalog ---------------------------------- */
fetch(A + "apps.json").then(r => r.json()).then(apps => {
  if (page === "apps") {
    const start = libpage * 15, count = Math.min(15, apps.length - start);
    for (let i = 0; i < count; i++) {
      const app = apps[start + i];
      const x = 80 + (i % 5) * 358, y = 266 + Math.floor(i / 5) * 245;
      slot(app.Name, 3, x, y, 328, 184, (el, f) => {
        el.style.background = app.Background;
        if (!app.Utility) {
          const im = document.createElement("img");
          im.src = A + app.Asset;
          const cover = app.Fit === "cover", iw = cover ? 328 : 274, ih = cover ? 184 : 144;
          im.style.cssText = `left:${(328 - iw) / 2}px;top:${(184 - ih) / 2}px;width:${iw}px;height:${ih}px;` +
                             `object-fit:${cover ? "cover" : "contain"};border-radius:18px`;
          el.appendChild(im);
        } else {
          const plus = hexLuma(app.Background) > 0.55 ? "#1C1C21" : T.ink;
          const hbar = document.createElement("div");
          hbar.style.cssText = `left:${328/2-28}px;top:${184/2-2}px;width:56px;height:4px;background:${plus}`;
          const vbar = document.createElement("div");
          vbar.style.cssText = `left:${328/2-2}px;top:${184/2-28}px;width:4px;height:56px;background:${plus}`;
          el.append(hbar, vbar);
        }
      });
      text(app.Name, x, y + 198, 328, 38, 27, T.ink, "Semibold");
    }
    text(apps.filter(a => !a.Utility).length + " apps", 80, 218, 500, 30, 21, T.muted);
  }
  if (page === "home") {
    const allowed = apps.map(a => "app:" + a.Id).concat(INPUTS.map(i => i.action));
    const dock = [];
    for (const a of recents.concat(DEFAULT_DOCK).concat(allowed)) {
      if (dock.length >= 5) break;
      if (allowed.includes(a) && !dock.includes(a)) dock.push(a);
    }
    const tile = (action, n) => {
      const x = Math.round(80 + n * (253.333 + 48));
      img("shadow-dock.svg", x - 24, 842, 301, 190, {opacity: focus === 3 + n ? 1 : 0.55});
      const input = INPUTS.find(i => i.action === action);
      const official = input ? null : apps.find(a => "app:" + a.Id === action);
      const label = official ? official.Name : input ? input.name : action;
      slot(label, 1, x, 854, 253, 126, el => {
        if (official) {
          el.style.background = official.Background;
          const im = document.createElement("img");
          im.src = A + official.Asset;
          im.style.cssText = "left:0;top:0;width:253px;height:126px;object-fit:cover;border-radius:22px";
          el.appendChild(im);
        } else {
          const im = document.createElement("img");
          im.src = A + "free-dock-" + (input ? input.dock : "apps") + ".svg";
          im.style.cssText = "left:0;top:0;width:253px;height:126px";
          el.appendChild(im);
        }
      });
    };
    dock.forEach(tile);
    tile("page:1", dock.length);
    slots[slots.length - 1].name = "Your Apps";
  }
  finish(apps);
});

function finish(apps) {
  if (page === "settings") {
    const tiles = [["Volume", "volume", "18", "Select · Left / Right to adjust"],
                   ["Brightness", "brightness", "Standard", "Select · Left / Right to adjust"],
                   ["Game Mode", "game", "Off", "Select to switch on or off"],
                   ["Sleep Timer", "sleep", "Off", "Select to change the timer"],
                   ["Sound", "mute", "Sound on", "Select to mute or unmute"],
                   ["Controllers", "controller", "Pair controller", "DualSense · hold PS + Create"],
                   ["Network", "network", "Connections", "Wi-Fi and connection setup"],
                   ["Advanced", "settings", "More settings", "Open Samsung's full settings"]];
    tiles.forEach((t, i) => {
      const x = 80 + (i % 4) * 450, y = 262 + Math.floor(i / 4) * 332;
      slot(t[0], 2, x, y, 410, 286, el => {
        const im = document.createElement("img");
        im.src = A + "quick-" + t[1] + ".svg";
        im.style.cssText = "left:0;top:0;width:410px;height:286px";
        const n = document.createElement("div"); n.className = "txt semibold";
        n.textContent = t[0]; n.style.cssText = "left:26px;top:25px;width:348px;height:42px;font-size:29px;color:#fff";
        const v = document.createElement("div"); v.className = "txt display";
        v.textContent = t[2]; v.style.cssText = "left:26px;top:151px;width:358px;height:56px;font-size:38px;color:#fff";
        const d = document.createElement("div"); d.className = "txt";
        d.textContent = t[3]; d.style.cssText = "left:26px;top:226px;width:370px;height:34px;font-size:20px;color:#F2F4FF";
        el.append(im, n, v, d);
      });
    });
    slot("Theme", 2, 80, 898, 1760, 104, el => {
      const l = document.createElement("div"); l.className = "txt semibold";
      l.textContent = "Theme"; l.style.cssText = `left:44px;top:0;width:240px;height:104px;font-size:28px;color:${T.muted}`;
      const v = document.createElement("div"); v.className = "txt display";
      v.textContent = themeName[0].toUpperCase() + themeName.slice(1);
      v.style.cssText = `left:300px;top:0;width:520px;height:104px;font-size:42px;color:${T.ink}`;
      const h = document.createElement("div"); h.className = "txt end";
      h.textContent = "Select or Left / Right to change";
      h.style.cssText = `left:0;top:0;width:1712px;height:104px;font-size:22px;color:${T.muted}`;
      el.append(l, v, h);
    });
  }
  [["Apps", "apps"], ["Inputs", "hdmi"], ["Settings", "settings"]].forEach((t, n) => {
    const x = 1596 + n * 88;
    slot(t[0], 4, x, 69, 68, 68, el => {
      const g = document.createElement("img"); g.src = A + "glass-button.svg";
      g.style.cssText = "left:-16px;top:-16px;width:100px;height:112px";
      const s = document.createElement("img"); s.src = A + "symbol-" + t[1] + ".png";
      s.style.cssText = `left:19px;top:19px;width:30px;height:30px;filter:${T.ink === "#1D1D1F" ? "invert(0.1)" : "invert(1)"}`;
      el.append(g, s);
    });
  });

  /* ---- paint slots in order, focus last so it stacks on top ----------- */
  const order = slots.map((s, i) => i).sort((a, b) => (a === focus ? 1 : 0) - (b === focus ? 1 : 0));
  for (const i of order) {
    const s = slots[i];
    if (s.row === 0) img(s.w > 400 ? "shadow-hero.svg" : "shadow-portrait.svg",
                         s.x - 24, s.y - 10, s.w + 48, s.h + 64, {opacity: i === focus ? 1 : 0.55});
    const el = card(s.x, s.y, s.w, s.h, s.row === 1 ? 22 : s.row === 2 ? 24 : s.row === 3 ? 18 : s.row === 4 ? 34 : 18,
                    T.card, i === focus, s.row);
    s.draw(el, i === focus);
  }
  text(page === "apps" ? "Select to open · Back to Home" : "Back to input", 1310, 1030, 530, 35, 20, T.muted, "Medium", "end");
  document.body.dataset.ready = "1";
}
</script>
</body>
</html>
